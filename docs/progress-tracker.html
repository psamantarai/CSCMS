<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  .updated { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
  .filters { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .filters button {
    padding: 0.4rem 0.9rem; border: 1px solid #888; border-radius: 999px;
    background: none; cursor: pointer; font-size: 0.85rem;
  }
  .filters button.active { background: #444; color: #fff; border-color: #444; }
  .task { border-left: 4px solid #ccc; padding: 0.6rem 1rem; margin-bottom: 0.7rem; border-radius: 4px; background: rgba(128,128,128,0.06); }
  .task.in-progress { border-left-color: #e0a200; }
  .task.pending { border-left-color: #888; }
  .task.completed { border-left-color: #2ea05e; opacity: 0.75; }
  .task-title { font-weight: 600; }
  .task-status { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: #888; margin-left: 0.5rem; }
  .task-detail { font-size: 0.9rem; color: #666; margin: 0.3rem 0 0; padding-left: 1.1rem; }
  .task-detail li { margin-top: 0.15rem; }
  .empty { color: #888; font-style: italic; }
</style>
</head>

<script>
  const STATUS_ORDER = { "in-progress": 0, "pending": 1, "completed": 2 };
  const data = JSON.parse(document.getElementById("tracker-data").textContent);
  const list = document.getElementById("list");
  const filters = document.getElementById("filters");

  const latest = data.map(t => t.updated).filter(Boolean).sort().pop();
  document.getElementById("updated").textContent = latest ? `Last updated: ${latest}` : "";

  function render(filter) {
    const sorted = [...data].sort((a, b) => {
      const byStatus = (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9);
      if (byStatus !== 0) return byStatus;
      return (b.seq ?? 0) - (a.seq ?? 0); // higher seq = touched more recently, shown first
    });
    const shown = filter === "all" ? sorted : sorted.filter(t => t.status === filter);
    list.innerHTML = shown.length
      ? shown.map(t => `
        <div class="task ${t.status}">
          <span class="task-title">${t.title}</span><span class="task-status">${t.status.replace("-", " ")}</span>
          ${t.details && t.details.length ? `<ul class="task-detail">${t.details.map(d => `<li>${d}</li>`).join("")}</ul>` : ""}
        </div>`).join("")
      : `<div class="empty">No tasks in this filter.</div>`;
  }

  filters.addEventListener("click", e => {
    if (e.target.tagName !== "BUTTON") return;
    filters.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    render(e.target.dataset.filter);
  });

  render("all");
</script>
